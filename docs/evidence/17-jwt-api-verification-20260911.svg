<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10172c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#38d5c5"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="54" y="48" width="1492" height="804" rx="30" fill="#0b1526" stroke="#2a4161" stroke-width="2"/>
  <rect x="54" y="48" width="1492" height="12" rx="6" fill="url(#accent)"/>
  <text x="104" y="130" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#a98cff">NEXO · EVIDENCIA DE SEGURIDAD</text>
  <text x="104" y="190" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#f4f7ff">MSAL, JWT y API protegida</text>
  <text x="104" y="232" font-family="Arial, sans-serif" font-size="22" fill="#9fb0c8">Verificación ejecutada el 11-09-2026 · tokens y datos personales redactados</text>

  <rect x="104" y="282" width="670" height="210" rx="22" fill="#101f35" stroke="#31506f"/>
  <text x="138" y="326" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#52e3d4">GET /api/public/health</text>
  <text x="138" y="375" font-family="Consolas, monospace" font-size="25" fill="#f4f7ff">HTTP 200 OK</text>
  <text x="138" y="422" font-family="Consolas, monospace" font-size="20" fill="#b9c8db">{ "status": "UP",</text>
  <text x="138" y="455" font-family="Consolas, monospace" font-size="20" fill="#b9c8db">  "service": "nexo-backend" }</text>

  <rect x="826" y="282" width="670" height="210" rx="22" fill="#101f35" stroke="#31506f"/>
  <text x="860" y="326" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#ffad72">GET /api/users/me</text>
  <text x="860" y="375" font-family="Consolas, monospace" font-size="25" fill="#f4f7ff">HTTP 401 Unauthorized</text>
  <text x="860" y="422" font-family="Consolas, monospace" font-size="20" fill="#b9c8db">Authorization: ausente</text>
  <text x="860" y="455" font-family="Arial, sans-serif" font-size="20" fill="#b9c8db">La ruta rechaza solicitudes sin JWT.</text>

  <rect x="104" y="530" width="912" height="250" rx="22" fill="#101f35" stroke="#31506f"/>
  <text x="138" y="577" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#a98cff">Dónde se refleja MSAL y el JWT</text>
  <circle cx="151" cy="628" r="8" fill="#7c5cff"/>
  <text x="178" y="636" font-family="Arial, sans-serif" font-size="21" fill="#e8eef8">MSAL obtiene el access token desde Microsoft Entra ID.</text>
  <circle cx="151" cy="681" r="8" fill="#38d5c5"/>
  <text x="178" y="689" font-family="Consolas, monospace" font-size="20" fill="#e8eef8">Authorization: Bearer eyJ... [REDACTADO]</text>
  <circle cx="151" cy="734" r="8" fill="#52e3d4"/>
  <text x="178" y="742" font-family="Arial, sans-serif" font-size="21" fill="#e8eef8">Spring Security valida firma, issuer, audiencia y scope.</text>

  <rect x="1060" y="530" width="436" height="250" rx="22" fill="#14223a" stroke="#52e3d4" stroke-width="2"/>
  <text x="1094" y="581" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f7ff">Pruebas de integración</text>
  <text x="1094" y="668" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#52e3d4">42 / 42</text>
  <text x="1094" y="717" font-family="Arial, sans-serif" font-size="22" fill="#b9c8db">0 fallos · 0 errores</text>
  <text x="1094" y="754" font-family="Arial, sans-serif" font-size="18" fill="#8799b3">Spring Boot + Testcontainers</text>

  <text x="104" y="823" font-family="Arial, sans-serif" font-size="18" fill="#7388a5">Colección reproducible: docs/postman/Nexo-Cloud-Native.postman_collection.json</text>
</svg>
