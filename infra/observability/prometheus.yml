global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: rabbitmq-node-1
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
      vhost: ["/"]
    static_configs:
      - targets: ["${APP_PRIVATE_IP}:15692"]
  - job_name: rabbitmq-node-2
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
      vhost: ["/"]
    static_configs:
      - targets: ["${APP_PRIVATE_IP}:15693"]
  - job_name: observability-host
    static_configs:
      - targets: [host.docker.internal:9100]
