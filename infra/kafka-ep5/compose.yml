name: nexo-kafka-ep5

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.9.0
  restart: unless-stopped
  mem_limit: 384m
  environment: &zookeeper-environment
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 5
    ZOOKEEPER_SYNC_LIMIT: 2
    ZOOKEEPER_SERVERS: "zk1:2888:3888;zk2:2888:3888;zk3:2888:3888"
  healthcheck:
    test: [CMD-SHELL, "cub zk-ready localhost:2181 10"]
    interval: 10s
    timeout: 8s
    retries: 12
    start_period: 15s

x-broker: &broker
  image: confluentinc/cp-kafka:7.9.0
  restart: unless-stopped
  mem_limit: 1024m
  environment: &broker-environment
    KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_LOG_RETENTION_MS: 604800000
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
  healthcheck:
    test: [CMD-SHELL, "cub kafka-ready -b localhost:9092 1 20"]
    interval: 15s
    timeout: 12s
    retries: 20
    start_period: 45s

services:
  zk1:
    <<: *zookeeper
    hostname: zk1
    environment:
      <<: *zookeeper-environment
      ZOOKEEPER_SERVER_ID: 1
    volumes: [zk1_data:/var/lib/zookeeper/data, zk1_log:/var/lib/zookeeper/log]
  zk2:
    <<: *zookeeper
    hostname: zk2
    environment:
      <<: *zookeeper-environment
      ZOOKEEPER_SERVER_ID: 2
    volumes: [zk2_data:/var/lib/zookeeper/data, zk2_log:/var/lib/zookeeper/log]
  zk3:
    <<: *zookeeper
    hostname: zk3
    environment:
      <<: *zookeeper-environment
      ZOOKEEPER_SERVER_ID: 3
    volumes: [zk3_data:/var/lib/zookeeper/data, zk3_log:/var/lib/zookeeper/log]
  kafka1:
    <<: *broker
    hostname: kafka1
    environment:
      <<: *broker-environment
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
    ports: ["127.0.0.1:9092:9092"]
    volumes: [kafka1_data:/var/lib/kafka/data]
    depends_on:
      zk1: {condition: service_healthy}
      zk2: {condition: service_healthy}
      zk3: {condition: service_healthy}
  kafka2:
    <<: *broker
    hostname: kafka2
    environment:
      <<: *broker-environment
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:9094
    ports: ["127.0.0.1:9094:9092"]
    volumes: [kafka2_data:/var/lib/kafka/data]
    depends_on:
      zk1: {condition: service_healthy}
      zk2: {condition: service_healthy}
      zk3: {condition: service_healthy}
  kafka3:
    <<: *broker
    hostname: kafka3
    environment:
      <<: *broker-environment
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://localhost:9096
    ports: ["127.0.0.1:9096:9092"]
    volumes: [kafka3_data:/var/lib/kafka/data]
    depends_on:
      zk1: {condition: service_healthy}
      zk2: {condition: service_healthy}
      zk3: {condition: service_healthy}
  kafka-topic-init:
    image: confluentinc/cp-kafka:7.9.0
    restart: "no"
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        for attempt in {1..30}; do
          /usr/bin/kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic nexo.messages.v1 --partitions 3 --replication-factor 3 --config retention.ms=604800000 --config min.insync.replicas=2 && break
          sleep 2
        done
        /usr/bin/kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic nexo.activity.v1 --partitions 3 --replication-factor 3 --config retention.ms=604800000 --config min.insync.replicas=2
        /usr/bin/kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic nexo.messages.v1.failed --partitions 3 --replication-factor 3 --config retention.ms=1209600000 --config min.insync.replicas=2
        /usr/bin/kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic nexo.activity.v1.failed --partitions 3 --replication-factor 3 --config retention.ms=1209600000 --config min.insync.replicas=2
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KAFKA_CLUSTERS_0_NAME: Nexo EP5/EP6
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports: ["127.0.0.1:18090:8080"]
    depends_on:
      kafka-topic-init: {condition: service_completed_successfully}
  kafka-admin:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.service
      args: {MODULE: kafka-admin}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8083
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      AZURE_ISSUER: ${AZURE_ISSUER:?Set AZURE_ISSUER}
      AZURE_AUDIENCE: ${AZURE_AUDIENCE:?Set AZURE_AUDIENCE}
      AZURE_JWK_SET_URI: ${AZURE_JWK_SET_URI:?Set AZURE_JWK_SET_URI}
      AZURE_REQUIRED_SCOPE: ${AZURE_REQUIRED_SCOPE:-access_as_user}
      NEXO_ADMIN_OBJECT_IDS: ${NEXO_ADMIN_OBJECT_IDS:-}
    ports: ["127.0.0.1:18083:8083"]
    depends_on:
      kafka-topic-init: {condition: service_completed_successfully}
  streaming-worker:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.service
      args: {MODULE: streaming-worker}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8084
      NEXO_EVENTS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_MESSAGES_TOPIC: nexo.messages.v1
      KAFKA_ACTIVITY_TOPIC: nexo.activity.v1
      KAFKA_MESSAGES_GROUP: nexo-message-audit
      KAFKA_ACTIVITY_GROUP: nexo-analytics
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-nexo}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD for the platform RabbitMQ cluster}
    ports: ["127.0.0.1:18084:8084"]
    depends_on:
      kafka-topic-init: {condition: service_completed_successfully}

volumes:
  zk1_data:
  zk1_log:
  zk2_data:
  zk2_log:
  zk3_data:
  zk3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
networks:
  default:
    name: nexo-platform_default
    external: true
