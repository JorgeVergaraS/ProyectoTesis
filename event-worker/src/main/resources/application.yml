spring:
  application:
    name: nexo-event-worker
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 4
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:nexo}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5
        default-requeue-rejected: false
        retry:
          enabled: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8081
nexo:
  events:
    enabled: true
    max-attempts: ${NEXO_EVENTS_MAX_ATTEMPTS:3}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
