spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  application:
    name: nexo-backend
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexo}
    username: ${SPRING_DATASOURCE_USERNAME:nexo}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nexo
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: public
    schemas: public
    locations: classpath:db/migration
    clean-disabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

nexo:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: nexo-backend
    phase: local-foundation

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.nexo: INFO
