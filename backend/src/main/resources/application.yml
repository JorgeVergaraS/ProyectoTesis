spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:nexo}
    password: ${RABBITMQ_PASSWORD:}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  application:
    name: nexo-backend
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexo}
    username: ${SPRING_DATASOURCE_USERNAME:nexo}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nexo
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: public
    schemas: public
    locations: classpath:db/migration
    clean-disabled: true
    ignore-migration-patterns: '*:missing'

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

nexo:
  events:
    enabled: ${NEXO_EVENTS_ENABLED:false}
    consumer-enabled: ${NEXO_EVENTS_CONSUMER_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  azure:
    issuer: ${AZURE_ISSUER:https://login.microsoftonline.com/21a4bbb2-fc48-4053-a98e-b805aa2306cc/v2.0}
    audience: ${AZURE_AUDIENCE:0f2d7cee-cabb-4482-900d-64fb07f5f81d,api://0f2d7cee-cabb-4482-900d-64fb07f5f81d}
    jwk-set-uri: ${AZURE_JWK_SET_URI:https://login.microsoftonline.com/21a4bbb2-fc48-4053-a98e-b805aa2306cc/discovery/v2.0/keys}
    required-scope: ${AZURE_REQUIRED_SCOPE:access_as_user}
  jwt:
    secret: ${NEXO_JWT_SECRET:}

management:
  health:
    rabbit:
      enabled: ${nexo.events.enabled}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: nexo-backend
    phase: local-foundation

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.nexo: INFO
