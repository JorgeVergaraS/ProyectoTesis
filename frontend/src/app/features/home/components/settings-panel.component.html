<section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <header class="settings-header">
    <div>
      <span class="eyebrow">TU EXPERIENCIA</span>
      <h2 id="settings-title">Configuración</h2>
    </div>
    <button
      #closeButton
      class="icon-button close-settings"
      type="button"
      aria-label="Cerrar configuración"
      title="Cerrar"
      (click)="close()"
    >
      <nexo-icon name="close" />
    </button>
  </header>

  <div class="settings-content">
    <div class="section-heading">
      <span class="section-icon" aria-hidden="true"><nexo-icon name="palette" /></span>
      <div>
        <h3>Apariencia</h3>
        <p>Elige cómo quieres ver Nexo. El cambio se aplica al instante.</p>
      </div>
    </div>

    <div class="theme-options" role="radiogroup" aria-label="Tema de colores">
      @for (option of options; track option.id) {
        <button
          class="theme-option"
          type="button"
          role="radio"
          [class.selected]="theme.current() === option.id"
          [attr.aria-checked]="theme.current() === option.id"
          (click)="select(option.id)"
        >
          <span class="theme-preview" [attr.data-preview]="option.id" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span class="theme-copy">
            <strong>{{ option.name }}</strong>
            <small>{{ option.description }}</small>
          </span>
          <span class="theme-check" aria-hidden="true"><nexo-icon name="check" /></span>
        </button>
      }
    </div>

    <div class="section-heading button-style-heading">
      <span class="section-icon" aria-hidden="true"><nexo-icon name="sparkle" /></span>
      <div>
        <h3>Estilo de los botones</h3>
        <p>Cada acabado adapta sus tonos automáticamente a la paleta elegida.</p>
      </div>
    </div>

    <div class="button-style-options" role="radiogroup" aria-label="Estilo de los botones">
      @for (style of buttonStyles; track style.id) {
        <button
          class="button-style-option"
          type="button"
          role="radio"
          [class.selected]="theme.buttonStyle() === style.id"
          [attr.aria-checked]="theme.buttonStyle() === style.id"
          (click)="selectButtonStyle(style.id)"
        >
          <span
            class="button-style-preview"
            [attr.data-style-preview]="style.id"
            aria-hidden="true"
          >
            <i>Botón</i>
          </span>
          <span class="theme-copy">
            <strong>{{ style.name }}</strong>
            <small>{{ style.description }}</small>
          </span>
          <span class="theme-check" aria-hidden="true"><nexo-icon name="check" /></span>
        </button>
      }
    </div>
  </div>
</section>
